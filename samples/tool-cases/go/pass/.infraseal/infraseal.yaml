project:
  name: go-pass-sample
  type: ai-service
runtime:
  preferred: local
  fallback: local
inputs:
  targets:
    - app/
  include:
    - app/
  exclude:
    - .git/**
    - .infraseal/reports/**
    - vendor/**
output:
  formats: [json, markdown, csv]
settings:
  block_on_critical: true
  minimum_readiness_score: 80
scanners:
  hallbayes_backend: dummy
  disabled: []
  options: {}
